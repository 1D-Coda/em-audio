name: Windows reproduction path

# The Windows entry point was written on macOS and could not be executed there.
# This runs it on a real Windows PowerShell 5.1.
#
# Every assertion is its own step. Step names and outcomes are readable from the
# public API without a token, so the run reports what happened even to someone
# who cannot read its logs. A single step that does five things would tell us
# only that one of them failed.
on:
  push:
    paths:
      - 'tools/reproduce.ps1'
      - 'tools/bootstrap_reproduction.py'
      - 'tools/repro_selftest.py'
      - '.gitattributes'
      - '.github/workflows/windows-reproduction.yml'
  workflow_dispatch:

jobs:
  windows:
    name: PowerShell 5.1 on windows-latest
    runs-on: windows-latest
    steps:
      - name: A. PowerShell version and git line-ending setting
        shell: powershell
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          $crlf = & git config --global core.autocrlf 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $crlf) { $crlf = "(unset)" }
          Write-Host "core.autocrlf: $crlf"
          $global:LASTEXITCODE = 0

      - name: B. Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress --limit-output
          # choco refreshes PATH for new shells only, so do not try to run the
          # tool in this step; the later steps see it. Verifying here is what
          # broke the previous attempt.
          $global:LASTEXITCODE = 0

      - name: B1. Install eSpeak NG at the reference version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          # Not choco's "espeak", which is classic eSpeak rather than eSpeak NG.
          # The corpus is synthesised with NG, and the two are different
          # synthesisers, so installing the wrong one would silently change what
          # is being reproduced. 1.52.0 is the version the reference machine used.
          $url = "https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi"
          Invoke-WebRequest $url -OutFile espeak-ng.msi -UseBasicParsing
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$PWD\espeak-ng.msi`" /qn /norestart"
          $found = $null
          foreach ($c in @("$env:ProgramFiles\eSpeak NG", "${env:ProgramFiles(x86)}\eSpeak NG")) {
            if (Test-Path (Join-Path $c "espeak-ng.exe")) { $found = $c; break }
          }
          if (-not $found) {
            Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter "espeak*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "candidate: $($_.FullName)" }
            Write-Host "::error::eSpeak NG installed but espeak-ng.exe was not found"
            exit 1
          }
          Add-Content $env:GITHUB_PATH $found
          Write-Host "eSpeak NG at $found"

      - name: B2. Install c2patool at a pinned version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          # Pinned rather than resolved from the releases API. Discovering the
          # latest release at run time would make this CI non-deterministic,
          # which is the wrong property for a reproducibility check, and the
          # first attempt failed inside that discovery rather than on anything
          # about the tool.
          $ver = "0.27.16"
          $url = "https://github.com/contentauth/c2pa-rs/releases/download/" +
                 "c2patool-v$ver/c2patool-v$ver-x86_64-pc-windows-msvc.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest $url -OutFile c2patool.zip -UseBasicParsing
          Expand-Archive c2patool.zip -DestinationPath "$env:RUNNER_TEMP\c2pa" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\c2pa" -Recurse -Filter c2patool.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "c2patool.exe not in the archive" }
          Add-Content $env:GITHUB_PATH $exe.Directory.FullName
          Write-Host "installed at $($exe.FullName)"

      - name: C. Download reproduce.ps1 over TLS, as a validator would
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tools/reproduce.ps1 -OutFile reproduce.ps1
          if (-not (Test-Path reproduce.ps1)) { throw "download produced no file" }

      - name: D. reproduce.ps1 parses under PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path reproduce.ps1), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; throw "parse errors" }
          Write-Host "parsed clean"

      - name: E. It clones, installs and self-tests (exits non-zero if a tool is missing)
        id: check
        shell: powershell
        continue-on-error: true
        run: |
          .\reproduce.ps1 -Check -Ref ${{ github.sha }} -Dir "$env:RUNNER_TEMP\emaudio"
          Write-Host "exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: E2. The target directory exists
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\emaudio"
          if (-not (Test-Path $d)) { throw "no directory at $d" }
          Get-ChildItem $d | Select-Object -First 12 Name | Format-Table

      - name: E3. It is a git checkout
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\emaudio\.git")) { throw "not a checkout" }

      - name: E4. c2patool is on PATH for the check
        shell: powershell
        run: |
          $c = Get-Command c2patool -ErrorAction SilentlyContinue
          if (-not $c) { throw "c2patool not on PATH" }
          Write-Host (& c2patool --version)

      - name: F. The clone actually happened
        shell: powershell
        run: |
          $p = "$env:RUNNER_TEMP\emaudio\run_all.sh"
          if (-not (Test-Path $p)) { throw "no clone at $p" }
          Write-Host "clone present"

      - name: G. run_all.sh survived checkout with LF endings
        shell: powershell
        run: |
          $b = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\emaudio\run_all.sh")
          for ($i = 0; $i -lt 400; $i++) {
            if ($b[$i] -eq 13 -and $b[$i+1] -eq 10) { throw "CRLF found: .gitattributes did not hold" }
          }
          Write-Host "LF endings, as .gitattributes requires"

      - name: H. bash can read run_all.sh
        shell: powershell
        run: |
          $p = ($env:RUNNER_TEMP -replace '\\','/') + "/emaudio/run_all.sh"
          bash -c "head -2 '$p'"
          if ($LASTEXITCODE -ne 0) { throw "bash could not read it" }

      - name: I. The Store-stub detection does not misfire on a real Python
        shell: powershell
        run: |
          $py = (Get-Command python).Source
          Write-Host "python at: $py"
          if ($py -like "*WindowsApps*") { throw "runner python is the Store stub" }

      - name: I2. pip installs the pinned requirements on Windows
        shell: powershell
        run: |
          python -m pip install -r "$env:RUNNER_TEMP\emaudio\requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed on Windows" }

      - name: I3a. Which self-test check is failing
        shell: powershell
        run: |
          # ::error:: writes into the run's annotations, which are readable from
          # the public API without a token. A bare throw only ever produces
          # "Process completed with exit code 1", which names nothing.
          $out = python "$env:RUNNER_TEMP\emaudio\tools\repro_selftest.py" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          $text = ($out | ForEach-Object { $_.ToString() }) -join "`n"
          foreach ($line in $text -split "`n") {
            if ($line -match "MISSING" -or $line -match "^\s+- ") {
              $clean = ($line -replace "[\r\n]", " ").Trim()
              Write-Host "::error::selftest: $clean"
            }
          }
          Write-Host "::notice::selftest exit was $LASTEXITCODE"
          $global:LASTEXITCODE = 0

      - name: I3. The package self-test passes with every tool present
        shell: powershell
        run: |
          python "$env:RUNNER_TEMP\emaudio\tools\repro_selftest.py"
          if ($LASTEXITCODE -ne 0) { throw "self-test failed with all tools installed" }

      - name: J. Report whether the check step passed
        shell: powershell
        run: |
          Write-Host "check outcome: ${{ steps.check.outcome }}"
          if ("${{ steps.check.outcome }}" -ne "success") {
            throw "the environment check did not pass; see step E"
          }

  full-pipeline:
    name: Full pipeline on Windows
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress --limit-output
          $global:LASTEXITCODE = 0

      - name: Install eSpeak NG 1.52.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest "https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi" -OutFile espeak-ng.msi -UseBasicParsing
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$PWD\espeak-ng.msi`" /qn /norestart"
          foreach ($c in @("$env:ProgramFiles\eSpeak NG", "${env:ProgramFiles(x86)}\eSpeak NG")) {
            if (Test-Path (Join-Path $c "espeak-ng.exe")) { Add-Content $env:GITHUB_PATH $c }
          }

      - name: Install c2patool 0.27.16
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $ver = "0.27.16"
          Invoke-WebRequest ("https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v$ver/c2patool-v$ver-x86_64-pc-windows-msvc.zip") -OutFile c2patool.zip -UseBasicParsing
          Expand-Archive c2patool.zip -DestinationPath "$env:RUNNER_TEMP\c2pa" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\c2pa" -Recurse -Filter c2patool.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $exe.Directory.FullName

      - name: Fetch and run the whole thing, exactly as a validator would
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tools/reproduce.ps1 -OutFile reproduce.ps1
          .\reproduce.ps1 -Ref ${{ github.sha }} -Dir "$env:RUNNER_TEMP\emaudio"
          $rc = $LASTEXITCODE
          Write-Host "::notice::bootstrapper exit $rc"
          if ($rc -ne 0) { Write-Host "::error::bootstrapper exited $rc" }
          $global:LASTEXITCODE = 0

      - name: The pipeline actually ran on THIS machine
        shell: powershell
        run: |
          # A previous run reported success while the pipeline never started:
          # bash died on a quoting error, the bootstrapper only printed it, and
          # the comparison then matched the repository's committed results
          # against themselves. These assertions exist so that cannot recur.
          $d = "$env:RUNNER_TEMP\emaudio"
          $pre = Join-Path $d "results\PREFLIGHT.txt"
          if (-not (Test-Path $pre)) { Write-Host "::error::no PREFLIGHT.txt"; exit 1 }
          $os = (Select-String -Path $pre -Pattern "^os:").Line
          Write-Host "::notice::$os"
          if ($os -notmatch "Windows") {
            Write-Host "::error::PREFLIGHT records '$os', so these results were not produced here"
            exit 1
          }
          $log = Join-Path $d "run_all_output.txt"
          if (-not (Test-Path $log)) { Write-Host "::error::no run_all_output.txt"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "RUN OK" -Quiet)) {
            $tail = (Get-Content $log -Tail 5) -join " | "
            Write-Host "::error::run_all.sh did not reach RUN OK: $tail"
            exit 1
          }
          Write-Host "::notice::pipeline completed on Windows with RUN OK"

      - name: Say which experiment failed and how
        if: always()
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\emaudio"
          $log = Join-Path $d "run_all_output.txt"
          if (Test-Path $log) {
            # The step banners are "=== name ===". Report the last one before
            # any traceback, plus the traceback's own last line, so the cause is
            # readable from the annotations API without a token.
            $lines = Get-Content $log
            $lastStep = ""
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^=== (.+) ===") { $lastStep = $Matches[1] }
              if ($lines[$i] -match "Traceback|RuntimeError|Error:|FAIL\b") {
                Write-Host "::error::during '$lastStep': $($lines[$i].Trim().Substring(0, [Math]::Min(150, $lines[$i].Trim().Length)))"
              }
            }
          }
          $v = Join-Path $d "verify_output.txt"
          if (Test-Path $v) {
            Get-Content $v | Select-String -Pattern "MISMATCH|MISSING|INHERITED|differ" |
              Select-Object -First 12 | ForEach-Object {
                Write-Host "::error::verify: $($_.Line.Trim())"
              }
          }

      - name: Report the outcome through annotations
        if: always()
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\emaudio"
          foreach ($f in @("run_all_output.txt","verify_output.txt")) {
            $p = Join-Path $d $f
            if (Test-Path $p) {
              $tail = (Get-Content $p -Tail 3) -join " | "
              Write-Host "::notice::$f tail: $tail"
            } else { Write-Host "::warning::$f not produced" }
          }
          $pre = Join-Path $d "results\PREFLIGHT.txt"
          if (Test-Path $pre) {
            foreach ($line in Get-Content $pre) {
              if ($line -match "^(python|ffmpeg|c2patool|node|espeak_ng|os):") {
                Write-Host "::notice::$line"
              }
            }
          }

      - name: Upload everything the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-run
          path: |
            ${{ runner.temp }}/emaudio/results/machine_readable/
            ${{ runner.temp }}/emaudio/results/PREFLIGHT.txt
            ${{ runner.temp }}/emaudio/run_all_output.txt
            ${{ runner.temp }}/emaudio/verify_output.txt
          if-no-files-found: warn
